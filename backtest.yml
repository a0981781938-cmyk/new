name: backtest
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 執行回測（約一個月的訊號）
        run: python backtest.py
      - name: 提交回測結果
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/backtest.json
          if git diff --cached --quiet; then
            echo "沒有新結果"
          else
            git commit -m "backtest $(date -u +%F)"
            git push
          fi
