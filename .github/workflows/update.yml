name: update-data
on:
  schedule:
    - cron: "0 7 * * 1-5"     # 台北 15:00，主要更新時間
    - cron: "10 8 * * 1-5"    # 台北 16:10，證交所晚公布時補抓
    - cron: "40 8 * * 1-5"    # 台北 16:40，最後一次補抓
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 還原歷史行情快取（不再提交到 git）
        uses: actions/cache@v4
        with:
          path: data/history.json
          key: history-${{ github.run_id }}
          restore-keys: history-
      - name: 產生資料
        run: python build_data.py
      - name: 提交結果（沒有變更就不提交）
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data.json data/signal_log.json
          if git diff --cached --quiet; then
            echo "沒有新資料，不提交"
          else
            git commit -m "update data $(date -u +%F)"
            git push
          fi
