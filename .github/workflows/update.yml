name: update-data
on:
  schedule:
    - cron: "40 7 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_data.py
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data.json data
          git diff --cached --quiet || git commit -m "update data" && git push
name: update-data
on:
  schedule:
    - cron: "40 7 * * 1-5"    # 台北 15:40
    - cron: "10 8 * * 1-5"    # 台北 16:10
    - cron: "40 8 * * 1-5"    # 台北 16:40
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 還原歷史行情快取
        uses: actions/cache@v4
        with:
          path: data/history.json
          key: history-${{ github.run_id }}
          restore-keys: history-
      - name: 產生資料
        run: python build_data.py
      - name: 提交結果
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data.json data/signal_log.json
          if git diff --cached --quiet; then
            echo "沒有新資料，不提交"
          else
            git commit -m "update data $(date -u +%F)"
            git push
          fi
